  <script>
    const products = {
      acer: { name: 'Acer Aspire 5', price: 3299 },
      lenovo: { name: 'Lenovo ThinkPad E14', price: 4799 },
      asus: { name: 'ASUS Vivobook 15', price: 3899 },
      dell: { name: 'Dell Inspiron 15', price: 4299 }
    };
    const cart = new Map();
    const formatPrice = value => new Intl.NumberFormat('pt-BR', { style:'currency', currency:'BRL' }).format(value);
    const drawer = document.getElementById('cart-drawer');
    const backdrop = document.getElementById('cart-backdrop');
    const rows = document.getElementById('cart-items');
    let previouslyFocused;

    function openCart() {
      previouslyFocused = document.activeElement;
      drawer.classList.add('open');
      backdrop.classList.add('open');
      drawer.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
      document.getElementById('close-cart').focus();
    }
    function closeCart() {
      drawer.classList.remove('open');
      backdrop.classList.remove('open');
      drawer.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
      previouslyFocused?.focus();
    }
    function makeButton(label, action, ariaLabel) {
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = label;
      button.setAttribute('aria-label', ariaLabel);
      button.className = 'rounded-lg border border-[#d8ded3] min-w-9 h-9 px-2 hover:bg-[#e7ecd9] focus-visible:outline';
      button.addEventListener('click', action);
      return button;
    }
    function renderCart() {
      let total = 0;
      let count = 0;
      for (const [id, quantity] of cart) {
        count += quantity;
        total += products[id].price * quantity;
      }
      document.getElementById('cart-count').textContent = count;
      document.getElementById('subtotal').textContent = formatPrice(total);
      document.getElementById('cart-empty').classList.toggle('hidden', count > 0);
      document.getElementById('cart-summary').classList.toggle('hidden', count === 0);
      rows.classList.toggle('hidden', count === 0);

      for (const row of [...rows.children]) {
        if (!cart.has(row.dataset.product)) row.remove();
      }
      for (const [id, quantity] of cart) {
        let row = [...rows.children].find(item => item.dataset.product === id);
        if (!row) {
          row = document.createElement('div');
          row.className = 'cart-row py-5 flex items-start justify-between gap-3';
          row.dataset.product = id;
          const details = document.createElement('div');
          details.className = 'min-w-0';
          const name = document.createElement('h3');
          name.className = 'font-bold';
          name.textContent = products[id].name;
          const price = document.createElement('p');
          price.className = 'text-sm text-[#69716b] mt-1';
          price.textContent = formatPrice(products[id].price) + ' por unidade';
          const controls = document.createElement('div');
          controls.className = 'flex items-center gap-2 mt-3';
          controls.append(
            makeButton('−', () => changeQuantity(id, -1), 'Diminuir quantidade de ' + products[id].name)
          );
          const qty = document.createElement('span');
          qty.className = 'quantity min-w-6 text-center font-semibold';
          qty.setAttribute('aria-label', 'Quantidade');
          controls.append(qty, makeButton('+', () => changeQuantity(id, 1), 'Aumentar quantidade de ' + products[id].name));
          details.append(name, price, controls);
          const right = document.createElement('div');
          right.className = 'flex flex-col items-end gap-3 shrink-0';
          const lineTotal = document.createElement('strong');
          lineTotal.className = 'line-total text-sm';
          right.append(lineTotal, makeButton('×', () => { cart.delete(id); renderCart(); }, 'Remover ' + products[id].name));
          row.append(details, right);
          rows.append(row);
        }
        row.querySelector('.quantity').textContent = quantity;
        row.querySelector('.line-total').textContent = formatPrice(products[id].price * quantity);
      }
    }
    function changeQuantity(id, amount) {
      const next = (cart.get(id) || 0) + amount;
      if (next <= 0) cart.delete(id);
      else cart.set(id, next);
      renderCart();
    }
    document.querySelectorAll('.add-button').forEach(button => {
      button.addEventListener('click', () => {
        changeQuantity(button.dataset.product, 1);
        openCart();
      });
    });
    document.getElementById('open-cart').addEventListener('click', openCart);
    document.getElementById('close-cart').addEventListener('click', closeCart);
    backdrop.addEventListener('click', closeCart);
    document.addEventListener('keydown', event => {
      if (!drawer.classList.contains('open')) return;
      if (event.key === 'Escape') closeCart();
      if (event.key === 'Tab') {
        const focusable = [...drawer.querySelectorAll('button:not([disabled])')];
        const first = focusable[0], last = focusable[focusable.length - 1];
        if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
        else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
      }
    });
    lucide.createIcons();
  </script>
